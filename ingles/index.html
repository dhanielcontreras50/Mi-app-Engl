<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3e5e0">
<title>Repaso de inglés</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="barra">
  <h1 class="marca">Repaso de <em>inglés</em></h1>
  <span class="contador" id="contador">—</span>
</header>

<main>

  <!-- ---------- REPASAR ---------- -->
  <section class="vista activa" id="vista-repasar">
    <div id="sesion"></div>
  </section>

  <!-- ---------- AGREGAR ---------- -->
  <section class="vista" id="vista-agregar">
    <label for="tipo">Tipo de tarjeta</label>
    <select id="tipo">
      <option value="vocab">Vocabulario</option>
      <option value="gramatica">Gramática</option>
      <option value="lectura">Lectura y audio</option>
      <option value="speaking">Speaking</option>
    </select>

    <label for="tema">Tema (opcional)</label>
    <input id="tema" placeholder="trabajo, viajes, phrasal verbs…" autocomplete="off">

    <div class="fila">
      <div>
        <label for="nivel">Nivel</label>
        <select id="nivel">
          <option>A2</option><option selected>B1</option><option>B2</option><option>C1</option>
        </select>
      </div>
      <div>
        <label for="cantidad">Cantidad</label>
        <select id="cantidad">
          <option>3</option><option selected>5</option><option>8</option><option>12</option>
        </select>
      </div>
    </div>

    <label><input type="checkbox" id="usarFallos" checked style="width:auto;margin-right:8px">
      Apuntar a mis errores recientes</label>

    <p style="margin:18px 0 10px"><button class="principal" id="btnGenerar">Generar tarjetas</button></p>
    <div id="resultadoGenerar"></div>
  </section>

  <!-- ---------- PROGRESO ---------- -->
  <section class="vista" id="vista-progreso">
    <div class="cifras" id="cifras"></div>
    <h3 style="font-family:var(--display);margin:24px 0 8px">Por tipo</h3>
    <div id="porTipo"></div>
  </section>

  <!-- ---------- AJUSTES ---------- -->
  <section class="vista" id="vista-ajustes">
    <label for="apiKey">Clave de API</label>
    <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
    <p class="pista">Se guarda solo en este celular, dentro de la app. Nunca va al repositorio.</p>

    <label for="modelo">Modelo</label>
    <input id="modelo" placeholder="claude-sonnet-5" autocomplete="off">

    <label for="limite">Tarjetas por sesión</label>
    <input id="limite" type="number" min="5" max="200" step="5">

    <p style="margin:18px 0 10px"><button class="principal" id="btnGuardarAjustes">Guardar ajustes</button></p>
    <div id="avisoAjustes"></div>

    <h3 style="font-family:var(--display);margin:28px 0 10px">Copia de seguridad</h3>
    <div class="fila">
      <button id="btnExportar">Exportar</button>
      <button id="btnImportar">Importar</button>
    </div>
    <input type="file" id="archivoImportar" accept="application/json" class="oculto">
    <p class="pista">El historial de intentos es lo que hace útil la app. Expórtalo de vez en cuando.</p>
  </section>

</main>

<nav>
  <button class="activa" data-vista="repasar">Repasar</button>
  <button data-vista="agregar">Agregar</button>
  <button data-vista="progreso">Progreso</button>
  <button data-vista="ajustes">Ajustes</button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
